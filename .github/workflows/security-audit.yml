name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pipx install pip-audit
      - name: Audit manifest.json requirements (blocking)
        run: |
          # Audits the runtime dependencies HA installs from the integration
          # manifest. --strict also fails when dependency collection fails.
          # pip-audit cannot audit requirements_test/dev.txt here because they
          # pin `homeassistant`, which does not resolve in pip-audit's sandbox.
          jq -r '.requirements[]' custom_components/alexa_media/manifest.json > /tmp/reqs.txt
          pip-audit --requirement /tmp/reqs.txt --strict

  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install osv-scanner
        run: |
          curl -fsSL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
      - name: Scan integration runtime dependencies
        run: |
          mkdir -p /tmp/osv-scan
          jq -r '.requirements[]' custom_components/alexa_media/manifest.json > /tmp/osv-scan/requirements.txt
          # Transitive CVE floors: alexapy allows aiohttp<4.0.0 (HA ships >=3.14);
          # idna is aiohttp's own dependency (< 3.15 → PYSEC-2026-215).
          cat >> /tmp/osv-scan/requirements.txt <<'EOF'
          aiohttp>=3.14.3
          idna>=3.15
          EOF
          /tmp/osv-scanner scan --recursive /tmp/osv-scan

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
